name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "部署环境"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      version:
        description: "版本号（可选）"
        required: false
        type: string

  push:
    branches: [main]
    paths:
      - "central/**"
      - "client/**"
      - "mcp/**"
      - "cmd/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Verify module
        run: |
          go mod tidy
          go mod verify

      - name: Run tests
        run: go test -v ./...

      - name: Build MCP binary
        run: |
          mkdir -p dist
          # Linux
          GOOS=linux GOARCH=amd64 go build -o dist/zerotier-mcp-linux-amd64 ./cmd/mcp
          GOOS=linux GOARCH=arm64 go build -o dist/zerotier-mcp-linux-arm64 ./cmd/mcp
          # macOS
          GOOS=darwin GOARCH=amd64 go build -o dist/zerotier-mcp-darwin-amd64 ./cmd/mcp
          GOOS=darwin GOARCH=arm64 go build -o dist/zerotier-mcp-darwin-arm64 ./cmd/mcp
          # Windows
          GOOS=windows GOARCH=amd64 go build -o dist/zerotier-mcp-windows-amd64.exe ./cmd/mcp

      - name: Create checksums
        run: |
          cd dist
          sha256sum zerotier-mcp-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-mcp-binaries
          path: dist/

      - name: Deploy notification
        run: |
          echo "✅ 部署完成"
          echo "环境: ${{ github.event.inputs.environment || 'production' }}"
          echo "版本: ${{ github.event.inputs.version || github.sha }}"
          echo "触发者: ${{ github.actor }}"
