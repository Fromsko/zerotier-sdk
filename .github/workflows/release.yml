name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Verify module
        run: |
          go mod tidy
          go mod verify

      - name: Run tests
        run: go test -v ./...

      - name: Build check
        run: |
          go build ./...
          go build ./example/...

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 安装

            ```bash
            go get github.com/fromsko/zerotier-sdk@${{ github.ref_name }}
            ```

            ## 使用

            ```go
            import zerotier "github.com/fromsko/zerotier-sdk"

            // 本地节点
            local := zerotier.NewClient()

            // 云端管理
            cloud := zerotier.NewCentral("token")
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
