name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: ""
          - os: linux
            arch: arm64
            suffix: ""
          - os: darwin
            arch: amd64
            suffix: ""
          - os: darwin
            arch: arm64
            suffix: ""
          - os: windows
            arch: amd64
            suffix: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Verify module
        run: |
          go mod tidy
          go mod verify

      - name: Run tests
        run: go test -v ./...

      - name: Build check
        run: |
          go build ./...
          go build ./example/...

      - name: Build MCP binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -o dist/zerotier-mcp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }} ./cmd/mcp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerotier-mcp-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/zerotier-mcp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Organize artifacts
        run: |
          mkdir -p release
          find dist -type f -name 'zerotier-mcp-*' -exec cp {} release/ \;
          ls -la release/

      - name: Create checksums
        run: |
          cd release
          sha256sum zerotier-mcp-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/zerotier-mcp-*
            release/SHA256SUMS
          body: |
            ## 📦 安装

            ### 使用 Go
            ```bash
            go get github.com/fromsko/zerotier-sdk@${{ github.ref_name }}
            ```

            ### 使用 MCP 二进制

            下载对应平台的二进制文件：
            - `zerotier-mcp-linux-amd64` - Linux x86_64
            - `zerotier-mcp-linux-arm64` - Linux ARM64
            - `zerotier-mcp-darwin-amd64` - macOS Intel
            - `zerotier-mcp-darwin-arm64` - macOS Apple Silicon
            - `zerotier-mcp-windows-amd64.exe` - Windows x86_64

            ## 🔧 配置 Claude Desktop

            编辑配置文件：
            - Linux/macOS: `~/.config/Claude/claude_desktop_config.json`
            - Windows: `%APPDATA%\Claude\claude_desktop_config.json`

            ```json
            {
              "mcpServers": {
                "zerotier": {
                  "command": "/path/to/zerotier-mcp-linux-amd64",
                  "env": {
                    "ZT_CENTRAL_TOKEN": "your_api_token"
                  }
                }
              }
            }
            ```

            ## ✅ 验证完整性

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ## 📚 使用示例

            ### 本地 API
            ```go
            import zerotier "github.com/fromsko/zerotier-sdk"

            local := zerotier.NewClient()
            status, _ := local.Status()
            networks, _ := local.Networks().List()
            ```

            ### 云端 API
            ```go
            cloud := zerotier.NewCentral("your_api_token")
            networks, _ := cloud.Networks().List()
            cloud.Networks().Members("nwid").Authorize("member_id")
            ```

            ### MCP 服务
            ```bash
            export ZT_CENTRAL_TOKEN="your_api_token"
            ./zerotier-mcp-linux-amd64
            ```

            ## 📖 文档

            - [主文档](https://github.com/fromsko/zerotier-sdk)
            - [Client API](https://github.com/fromsko/zerotier-sdk/tree/main/client)
            - [Central API](https://github.com/fromsko/zerotier-sdk/tree/main/central)
            - [MCP 集成](https://github.com/fromsko/zerotier-sdk/tree/main/mcp)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
